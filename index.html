<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Banana Nocturne</title>
    <style>
      :root {
        --bg: #0b0710;
        --ink: #f2ecff;
        --dim: #9d93b8;
        --gold: #f7d84a;
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        overflow: hidden;
        font: 14px/1.4 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      canvas {
        image-rendering: pixelated;
        outline: none;
      }
      .touch-note {
        display: none;
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
        background: rgba(11, 7, 16, 0.92);
        color: var(--dim);
        text-align: center;
      }
      .touch-note strong {
        color: var(--gold);
        font-weight: 600;
      }
      @media (pointer: coarse) {
        .touch-note {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <p class="touch-note"><strong>Keyboard needed.</strong> Banana Nocturne is played with WASD or the arrow keys on a desktop browser.</p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
